# Render blueprint for the persistent Express + Socket.IO game server.
#
# Vercel cannot host this process: its functions are request-scoped, so they do
# not keep Socket.IO/WebSocket connections open, and rooms and scores live in
# memory for the duration of a match. Vercel serves the static client only.
#
# Deploy: Render dashboard -> New -> Blueprint -> connect this repository.
# The service URL is https://fps-gods-server.onrender.com unless you rename it;
# that URL is what you put in Vercel's VITE_SOCKET_URL build variable.
#
# Note on the free plan: instances sleep after ~15 minutes without traffic, so
# the first player after an idle period waits for a cold start. Switch `plan` to
# `starter` (or any paid plan) for an always-warm arena.
services:
  - type: web
    name: fps-gods-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    # Express route used by Render's health checks; also handy for curl checks.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # package.json requires Node >= 20.19 (Vite 8); pin the verified version.
      - key: NODE_VERSION
        value: 22.22.3
      - key: HOST
        value: 0.0.0.0
      # Render injects PORT automatically and server/index.js already reads it.
